name: Test Upstream + macOS 15 Compatibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Upstream + PR #8 / Intel macOS 15
    runs-on: macos-15

    steps:
      - name: Checkout latest upstream
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: main
          fetch-depth: 0

      - name: Select Xcode
        run: |
          echo "=== Installed Xcodes ==="
          ls -1 /Applications | grep '^Xcode' || true

          echo
          echo "=== Current developer directory ==="
          xcode-select -p

          echo
          echo "=== Current Xcode ==="
          xcodebuild -version

      - name: Fetch PR #8 compatibility commit
        run: |
          git fetch https://github.com/gingerbeardman/Compositor.git \
            ec64a9bd990a3f0a6a350a36ca6fe435026d4b04

      - name: Apply PR #8
        run: |
          git cherry-pick ec64a9bd990a3f0a6a350a36ca6fe435026d4b04

      - name: Build Intel Release
        run: |
          set -o pipefail

          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
