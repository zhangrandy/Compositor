name: Test Upstream → Intel Sequoia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout current upstream main
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: main
          fetch-depth: 1

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcode-select -p

      - name: Apply macOS 15 compatibility patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text()
              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly 1 occurrence in {path}, found {count}: {old!r}"
                  )

              path.write_text(text.replace(old, new, 1))
              print(f"Patched {path}")

          # ------------------------------------------------------------
          # ContentView.swift
          # ------------------------------------------------------------

          replace_once(
              "Compositor/ContentView.swift",
              "            ToolbarSpacer(.fixed, placement: .navigation)",
              """            if #available(macOS 26.0, *) {
                  ToolbarSpacer(.fixed, placement: .navigation)
              }"""
          )

          replace_once(
              "Compositor/ContentView.swift",
              "            ToolbarSpacer(.flexible, placement: .navigation)",
              """            if #available(macOS 26.0, *) {
                  ToolbarSpacer(.flexible, placement: .navigation)
              }"""
          )

          # Wrap the entire ProjectTabStrip ToolbarItem because
          # sharedBackgroundVisibility itself is macOS 26-only.
          path = Path("Compositor/ContentView.swift")
          lines = path.read_text().splitlines()

          workspace_marker = "            if let workspace = applicationDelegate?.workspace {"
          toolbar_marker = "            ToolbarItem(placement: .navigation) {"
          modifier_marker = "                .sharedBackgroundVisibility(.hidden)"

          workspace_indexes = [
              i for i, line in enumerate(lines)
              if line == workspace_marker
          ]

          if len(workspace_indexes) != 1:
              raise SystemExit(
                  f"Expected exactly 1 workspace block, found {len(workspace_indexes)}"
              )

          workspace_start = workspace_indexes[0]

          toolbar_candidates = [
              i for i in range(workspace_start + 1, len(lines))
              if lines[i] == toolbar_marker
          ]

          if len(toolbar_candidates) < 1:
              raise SystemExit("Could not find ProjectTabStrip ToolbarItem")

          toolbar_start = toolbar_candidates[0]

          modifier_candidates = [
              i for i in range(toolbar_start + 1, len(lines))
              if lines[i] == modifier_marker
          ]

          if len(modifier_candidates) != 1:
              raise SystemExit(
                  f"Expected exactly 1 sharedBackgroundVisibility modifier, "
                  f"found {len(modifier_candidates)}"
              )

          modifier_index = modifier_candidates[0]

          # Find the closing brace of the ToolbarItem.
          depth = 0
          toolbar_end = None

          for i in range(toolbar_start, modifier_index + 1):
              depth += lines[i].count("{")
              depth -= lines[i].count("}")

              if i > toolbar_start and depth == 0:
                  toolbar_end = i
                  break

          if toolbar_end is None:
              raise SystemExit("Could not determine end of ToolbarItem")

          item = lines[toolbar_start:modifier_index + 1]

          def indent(block, spaces):
              prefix = " " * spaces
              return [
                  prefix + line if line else line
                  for line in block
              ]

          # Existing ToolbarItem is already indented 12 spaces.
          # Move it four spaces deeper inside each availability branch.
          item_indented = [
              "    " + line
              for line in item
          ]

          replacement = [
              "                if #available(macOS 26.0, *) {",
              *item_indented,
              "                } else {",
              *item_indented,
              "                }",
          ]

          lines[toolbar_start:modifier_index + 1] = replacement

          path.write_text("\n".join(lines) + "\n")
          print("Patched ContentView.swift ProjectTabStrip availability")

          # ------------------------------------------------------------
          # BlendModePicker.swift
          # ------------------------------------------------------------

          replace_once(
              "Compositor/UI/BlendModePicker.swift",
              "        button.borderShape = .capsule",
              """        if #available(macOS 26.0, *) {
                  button.borderShape = .capsule
              } else {
                  button.bezelStyle = .rounded
              }"""
          )

          # ------------------------------------------------------------
          # TypeControls.swift
          # ------------------------------------------------------------

          replace_once(
              "Compositor/UI/TypeControls.swift",
              "        button.borderShape = .capsule",
              """        if #available(macOS 26.0, *) {
                  button.borderShape = .capsule
              } else {
                  button.bezelStyle = .rounded
              }"""
          )

          print("macOS 15 compatibility patch applied successfully.")
          PY

      - name: Show compatibility changes
        run: |
          git diff -- \
            Compositor/ContentView.swift \
            Compositor/UI/BlendModePicker.swift \
            Compositor/UI/TypeControls.swift

      - name: Build Intel macOS 15 release
        run: |
          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
