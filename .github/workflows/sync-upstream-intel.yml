name: Test Upstream → Intel macOS 26

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout current upstream main
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: main
          fetch-depth: 1

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcode-select -p

      - name: Build Intel macOS 26 release
        run: |
          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Intel architecture and deployment target
        run: |
          APP="build/Build/Products/Release/Compositor.app"

          test -d "$APP"

          echo "=== Binary architecture ==="
          lipo -info "$APP/Contents/MacOS/Compositor"

          echo "=== Minimum macOS version ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :LSMinimumSystemVersion' \
            "$APP/Contents/Info.plist" || true

      - name: Package Intel macOS 26 app
        run: |
          cd build/Build/Products/Release
          tar -czf "$GITHUB_WORKSPACE/Compositor-Intel-macOS26.tar.gz" Compositor.app

      - name: Upload Intel macOS 26 app
        uses: actions/upload-artifact@v4
        with:
          path: Compositor-Intel-macOS26.tar.gz
          archive: false
