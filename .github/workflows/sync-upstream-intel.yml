name: Test Upstream → Intel Sequoia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout current upstream main
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: main
          fetch-depth: 1

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcode-select -p

      - name: Apply macOS 15 compatibility patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text()
              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly 1 occurrence in {path}, found {count}: {old!r}"
                  )

              path.write_text(text.replace(old, new, 1))
              print(f"Patched {path}")

          # ------------------------------------------------------------
          # ContentView.swift
          # ------------------------------------------------------------

          replace_once(
              "Compositor/ContentView.swift",
              "            ToolbarSpacer(.fixed, placement: .navigation)",
              """            if #available(macOS 26.0, *) {
                  ToolbarSpacer(.fixed, placement: .navigation)
              }"""
          )

          replace_once(
              "Compositor/ContentView.swift",
              "            ToolbarSpacer(.flexible, placement: .navigation)",
              """            if #available(macOS 26.0, *) {
                  ToolbarSpacer(.flexible, placement: .navigation)
              }"""
          )

          # Find the ToolbarItem immediately preceding the unique
          # sharedBackgroundVisibility modifier and wrap that item.
          path = Path("Compositor/ContentView.swift")
          lines = path.read_text().splitlines()

          modifier_indexes = [
              i for i, line in enumerate(lines)
              if ".sharedBackgroundVisibility(.hidden)" in line
          ]

          if len(modifier_indexes) != 1:
              raise SystemExit(
                  "Expected exactly 1 sharedBackgroundVisibility modifier, "
                  f"found {len(modifier_indexes)}"
              )

          modifier_index = modifier_indexes[0]

          # The modifier belongs to the ToolbarItem immediately above it.
          toolbar_start = None
          depth = 0

          for i in range(modifier_index - 1, -1, -1):
              line = lines[i]

              if line == "            ToolbarItem(placement: .navigation) {":
                  toolbar_start = i
                  break

          if toolbar_start is None:
              raise SystemExit(
                  "Could not find ToolbarItem preceding "
                  "sharedBackgroundVisibility"
              )

          # Find the closing brace belonging to this ToolbarItem.
          depth = 0
          toolbar_end = None

          for i in range(toolbar_start, modifier_index + 1):
              depth += lines[i].count("{")
              depth -= lines[i].count("}")

              if i > toolbar_start and depth == 0:
                  toolbar_end = i
                  break

          if toolbar_end is None:
              raise SystemExit("Could not find end of ToolbarItem")

          # Include the modifier line in the macOS 26 branch.
          item = lines[toolbar_start:modifier_index + 1]

          # The original item is 12-space indented.
          # Put it four spaces deeper inside each availability branch.
          nested_item = [
              "    " + line
              for line in item
          ]

          replacement = [
              "            if #available(macOS 26.0, *) {",
              *nested_item,
              "            } else {",
          ]

          # For the macOS 15 branch, remove the macOS-26-only modifier.
          fallback_item = [
              "    " + line
              for line in item
              if ".sharedBackgroundVisibility(.hidden)" not in line
          ]

          replacement.extend(fallback_item)
          replacement.append("            }")

          lines[toolbar_start:modifier_index + 1] = replacement

          path.write_text("\n".join(lines) + "\n")
          print("Patched ContentView.swift sharedBackgroundVisibility")

          # ------------------------------------------------------------
          # BlendModePicker.swift
          # ------------------------------------------------------------

          replace_once(
              "Compositor/UI/BlendModePicker.swift",
              "        button.borderShape = .capsule",
              """        if #available(macOS 26.0, *) {
                  button.borderShape = .capsule
              } else {
                  button.bezelStyle = .rounded
              }"""
          )

          # ------------------------------------------------------------
          # TypeControls.swift
          # ------------------------------------------------------------

          replace_once(
              "Compositor/UI/TypeControls.swift",
              "        button.borderShape = .capsule",
              """        if #available(macOS 26.0, *) {
                  button.borderShape = .capsule
              } else {
                  button.bezelStyle = .rounded
              }"""
          )

          print("macOS 15 compatibility patch applied successfully.")
          PY

      - name: Show compatibility changes
        run: |
          git diff -- \
            Compositor/ContentView.swift \
            Compositor/UI/BlendModePicker.swift \
            Compositor/UI/TypeControls.swift

      - name: Build Intel macOS 15 release
        run: |
          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
