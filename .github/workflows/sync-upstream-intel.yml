name: Test Upstream → Intel Sequoia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout current upstream main
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: main
          fetch-depth: 1

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcode-select -p

      - name: Apply macOS 15 compatibility patch
        run: |
          cat > /tmp/macos15.patch <<'PATCH'
          diff --git a/Compositor/ContentView.swift b/Compositor/ContentView.swift
          --- a/Compositor/ContentView.swift
          +++ b/Compositor/ContentView.swift
          @@
          -            ToolbarSpacer(.fixed, placement: .navigation)
          +            if #available(macOS 26.0, *) {
          +                ToolbarSpacer(.fixed, placement: .navigation)
          +            }
                       if let workspace = applicationDelegate?.workspace {
          -                ToolbarItem(placement: .navigation) {
          -                    ProjectTabStrip(workspace: workspace)
          -                        .frame(minWidth: 100)
          -                }
          -                .sharedBackgroundVisibility(.hidden)
          +                if #available(macOS 26.0, *) {
          +                    ToolbarItem(placement: .navigation) {
          +                        ProjectTabStrip(workspace: workspace)
          +                            .frame(minWidth: 100)
          +                    }
          +                    .sharedBackgroundVisibility(.hidden)
          +                } else {
          +                    ToolbarItem(placement: .navigation) {
          +                        ProjectTabStrip(workspace: workspace)
          +                            .frame(minWidth: 100)
          +                    }
          +                }
                       }
          @@
          -            ToolbarSpacer(.flexible, placement: .navigation)
          +            if #available(macOS 26.0, *) {
          +                ToolbarSpacer(.flexible, placement: .navigation)
          +            }
          PATCH

          echo "Checking ContentView patch..."
          git apply --check /tmp/macos15.patch

          echo "Applying ContentView patch..."
          git apply /tmp/macos15.patch

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text()
              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly 1 occurrence in {path}, found {count}"
                  )

              path.write_text(text.replace(old, new, 1))
              print(f"Patched {path}")

          replace_once(
              "Compositor/UI/BlendModePicker.swift",
              "        button.borderShape = .capsule",
              """        if #available(macOS 26.0, *) {
                  button.borderShape = .capsule
              } else {
                  button.bezelStyle = .rounded
              }"""
          )

          replace_once(
              "Compositor/UI/TypeControls.swift",
              "        button.borderShape = .capsule",
              """        if #available(macOS 26.0, *) {
                  button.borderShape = .capsule
              } else {
                  button.bezelStyle = .rounded
              }"""
          )

          print("macOS 15 compatibility patch applied successfully.")
          PY

      - name: Show compatibility changes
        run: |
          git diff -- \
            Compositor/ContentView.swift \
            Compositor/UI/BlendModePicker.swift \
            Compositor/UI/TypeControls.swift

      - name: Build Intel macOS 15 release
        run: |
          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
