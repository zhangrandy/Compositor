name: Test Upstream → Intel Sequoia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout current upstream main
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: main
          fetch-depth: 1

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcode-select -p

      - name: Apply macOS 15 compatibility patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text()
              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly 1 occurrence in {path}, "
                      f"found {count}: {old!r}"
                  )

              path.write_text(text.replace(old, new, 1))
              print(f"Patched {path}")

          # ------------------------------------------------------------
          # ContentView.swift
          # ------------------------------------------------------------

          replace_once(
              "Compositor/ContentView.swift",
              "ToolbarSpacer(.fixed, placement: .navigation)",
              """if #available(macOS 26.0, *) {
                  ToolbarSpacer(.fixed, placement: .navigation)
              }"""
          )

          replace_once(
              "Compositor/ContentView.swift",
              "ToolbarSpacer(.flexible, placement: .navigation)",
              """if #available(macOS 26.0, *) {
                  ToolbarSpacer(.flexible, placement: .navigation)
              }"""
          )

          # Wrap the ProjectTabStrip ToolbarItem because
          # sharedBackgroundVisibility is macOS 26-only.
          path = Path("Compositor/ContentView.swift")
          lines = path.read_text().splitlines()

          modifier_indexes = [
              i for i, line in enumerate(lines)
              if ".sharedBackgroundVisibility(.hidden)" in line
          ]

          if len(modifier_indexes) != 1:
              raise SystemExit(
                  "Expected exactly one sharedBackgroundVisibility, "
                  f"found {len(modifier_indexes)}"
              )

          modifier_index = modifier_indexes[0]

          toolbar_candidates = [
              i
              for i in range(modifier_index - 1, -1, -1)
              if lines[i].strip() == "ToolbarItem(placement: .navigation) {"
          ]

          if not toolbar_candidates:
              raise SystemExit(
                  "Could not find ToolbarItem before "
                  "sharedBackgroundVisibility"
              )

          toolbar_start = toolbar_candidates[0]

          if not any(
              "ProjectTabStrip(workspace: workspace)" in lines[i]
              for i in range(toolbar_start, modifier_index)
          ):
              raise SystemExit(
                  "Found ToolbarItem, but it is not the ProjectTabStrip item"
              )

          base_indent = lines[toolbar_start][
              :len(lines[toolbar_start])
              - len(lines[toolbar_start].lstrip())
          ]

          original = lines[toolbar_start:modifier_index + 1]

          nested = [
              base_indent + "    " + line[len(base_indent):]
              if line.startswith(base_indent)
              else "    " + line
              for line in original
          ]

          fallback = [
              line
              for line in nested
              if ".sharedBackgroundVisibility(.hidden)" not in line
          ]

          replacement = [
              base_indent + "if #available(macOS 26.0, *) {",
              *nested,
              base_indent + "} else {",
              *fallback,
              base_indent + "}",
          ]

          lines[toolbar_start:modifier_index + 1] = replacement

          path.write_text("\n".join(lines) + "\n")
          print("Patched ContentView.swift sharedBackgroundVisibility")

          # ------------------------------------------------------------
          # BlendModePicker.swift
          # ------------------------------------------------------------

          replace_once(
              "Compositor/UI/BlendModePicker.swift",
              "button.borderShape = .capsule",
              """if #available(macOS 26.0, *) {
                  button.borderShape = .capsule
              } else {
                  button.bezelStyle = .rounded
              }"""
          )

          # ------------------------------------------------------------
          # TypeControls.swift
          # ------------------------------------------------------------

          replace_once(
              "Compositor/UI/TypeControls.swift",
              "button.borderShape = .capsule",
              """if #available(macOS 26.0, *) {
                  button.borderShape = .capsule
              } else {
                  button.bezelStyle = .rounded
              }"""
          )

          print("macOS 15 compatibility patch applied successfully.")
          PY

      - name: Show compatibility changes
        run: |
          echo "=== Compatibility diff ==="
          git diff -- \
            Compositor/ContentView.swift \
            Compositor/UI/BlendModePicker.swift \
            Compositor/UI/TypeControls.swift

      - name: Build Intel macOS 15 release
        run: |
          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
