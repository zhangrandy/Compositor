name: Sync Upstream → Intel Sequoia

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: macos-15

    steps:
      - name: Checkout latest upstream
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: main
          fetch-depth: 0

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Apply Intel / macOS 15 compatibility patch
        run: |
          git fetch https://github.com/robbietilton/Compositor.git \
            ec64a9bd990a3f0a6a350a36ca6fe435026d4b04

          git cherry-pick ec64a9bd990a3f0a6a350a36ca6fe435026d4b04

      - name: Build Intel Release
        run: |
          set -o pipefail

          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Intel architecture
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/Compositor.app"
          BINARY="$APP/Contents/MacOS/Compositor"

          file "$BINARY"
          lipo -info "$BINARY"

      - name: Update intel-sequoia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git push \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            HEAD:intel-sequoia
