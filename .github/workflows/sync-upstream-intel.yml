name: Test Upstream → Intel Sequoia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout current upstream main
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: main
          fetch-depth: 1

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcode-select -p

      - name: Inspect current upstream ContentView
        run: |
          echo "=== ContentView.swift toolbar section ==="
          nl -ba Compositor/ContentView.swift | sed -n '150,190p'

          echo
          echo "=== All macOS 26 APIs in ContentView.swift ==="
          grep -nE 'ToolbarSpacer|sharedBackgroundVisibility' \
            Compositor/ContentView.swift || true

          echo
          echo "=== borderShape occurrences ==="
          grep -n 'borderShape' \
            Compositor/UI/BlendModePicker.swift \
            Compositor/UI/TypeControls.swift || true

          exit 1

      - name: Show compatibility changes
        run: |
          git diff -- \
            Compositor/ContentView.swift \
            Compositor/UI/BlendModePicker.swift \
            Compositor/UI/TypeControls.swift

      - name: Build Intel macOS 15 release
        run: |
          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
