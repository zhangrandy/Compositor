name: Test Upstream → Intel macOS 26

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout current upstream main
        uses: actions/checkout@v4
        with:
          repository: robbietilton/Compositor
          ref: main
          fetch-depth: 1

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcode-select -p

      - name: Fix CameraRawShadows type-check complexity
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Compositor/Document/CameraRawShadows.swift")
          source = path.read_text()

          old = "return (0..<count).map { i in (lower?[i] ?? 0) * (1 - t) + (upper?[i] ?? 0) * t }"

          new = """return (0..<count).map { i in
              let lowerValue: Float = lower?[i] ?? 0
              let upperValue: Float = upper?[i] ?? 0
              let oneMinusT: Float = 1.0 - t
              let lowerContribution: Float = lowerValue * oneMinusT
              let upperContribution: Float = upperValue * t
              return lowerContribution + upperContribution
          }"""

          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f"Expected exactly one CameraRawShadows expression, found {count}. "
                  "Upstream may have changed; review the source before patching."
              )

          path.write_text(source.replace(old, new, 1))
          print(f"Patched {path}")
          PY

      - name: Show source patch
        run: |
          git diff --check
          git diff -- Compositor/Document/CameraRawShadows.swift

      - name: Build Intel macOS 26 release
        run: |
          xcodebuild \
            -project Compositor.xcodeproj \
            -scheme Compositor \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Intel architecture and deployment target
        run: |
          APP="build/Build/Products/Release/Compositor.app"

          test -d "$APP"

          echo "=== Binary architecture ==="
          lipo -info "$APP/Contents/MacOS/Compositor"

          echo "=== Minimum macOS version ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :LSMinimumSystemVersion' \
            "$APP/Contents/Info.plist" || true

      - name: Package Intel macOS 26 app
        run: |
          cd build/Build/Products/Release
          tar -czf "$GITHUB_WORKSPACE/Compositor-Intel-macOS26.tar.gz" Compositor.app

      - name: Upload Intel macOS 26 app
        uses: actions/upload-artifact@v4
        with:
          path: Compositor-Intel-macOS26.tar.gz
          archive: false
